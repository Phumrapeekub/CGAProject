<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CGA Nurse{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/th.js"></script>
  <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-slate-900">
  <nav class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-[100] shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
      <a href="{{ url_for('nurse.dashboard') }}" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="CGA Logo" class="w-8 h-8 object-contain">
        <span class="text-xl font-bold tracking-tight">CGA<span class="text-blue-600">Nurse</span></span>
      </a>
      <div class="flex items-center gap-4">
        <span class="text-sm text-slate-600">ผู้ใช้งาน: <span class="font-semibold">{{ user }}</span></span>
        <a href="{{ url_for('auth.logout') }}" class="text-sm font-medium text-rose-600">ออกจากระบบ</a>
      </div>
    </div>
  </nav>
  <main class="py-6">
    <div class="max-w-7xl mx-auto px-4">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="mb-6 space-y-2">
            {% for category, message in messages %}
              <div class="p-4 rounded-xl border {% if category == 'danger' or category == 'error' %}bg-red-50 border-red-200 text-red-700{% elif category == 'success' %}bg-emerald-50 border-emerald-200 text-emerald-700{% else %}bg-amber-50 border-amber-200 text-amber-700{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
    </div>
    {% block content %}{% endblock %}
  </main>
  <!-- flatpickr: อินพุตที่มี data-buddhist-date="1" จะเป็น พ.ศ. -->
  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const inputs = document.querySelectorAll('[data-buddhist-date="1"]');
    if (!inputs.length) return;

    inputs.forEach((input) => {
      flatpickr(input, {
        dateFormat: "d/m/Y",
        locale: "th",
        // บังคับให้แสดงปี พ.ศ. ใน Popup
        onOpen: function(selectedDates, dateStr, instance) {
            updateFlatpickrYear(instance);
        },
        onMonthChange: function(selectedDates, dateStr, instance) {
            setTimeout(() => updateFlatpickrYear(instance), 0);
        },
        onYearChange: function(selectedDates, dateStr, instance) {
            setTimeout(() => updateFlatpickrYear(instance), 0);
        },
        // พ.ศ. -> ค.ศ. (ตอนอ่านค่าจากช่องกรอก)
        parseDate: (datestr) => {
          if (!datestr) return null;
          const parts = datestr.split("/");
          if (parts.length !== 3) return null;
          let year = parseInt(parts[2], 10);
          // ถ้าปีเกิน 2400 แสดงว่าเป็น พ.ศ. ให้แปลงเป็น ค.ศ. ก่อนส่งเข้าเครื่อง
          if (year > 2400) year -= 543;
          return new Date(year, parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
        },
        // ค.ศ. -> พ.ศ. (ตอนแสดงผลกลับเข้าช่องกรอก)
        formatDate: (date) => {
          const d = ("0" + date.getDate()).slice(-2);
          const m = ("0" + (date.getMonth() + 1)).slice(-2);
          let y = date.getFullYear();
          // ถ้าปีเป็น ค.ศ. (น้อยกว่า 2400) ค่อยบวก 543
          if (y < 2400) y += 543;
          return `${d}/${m}/${y}`;
        },
      });
    });

    // ฟังก์ชันช่วยเปลี่ยนปีใน UI ของ Flatpickr เป็น พ.ศ.
    function updateFlatpickrYear(instance) {
        const yearInput = instance.currentYearElement;
        if (yearInput) {
            let year = parseInt(yearInput.value);
            if (year < 2400) {
                yearInput.value = year + 543;
            }
        }
    }
  });
  </script>
</body>
</html>
