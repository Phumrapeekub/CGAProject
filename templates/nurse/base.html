<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}CGA System{% endblock %}</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { prompt: ['Prompt', 'ui-sans-serif', 'system-ui'] },
          colors: { brand: { 500: '#2563eb', 600:'#1d4ed8' } }
        }
      }
    }
  </script>

  <!-- ฟอนต์ -->
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ฟอนต์หลักทั้งเว็บ */
    html {
      font-size: 18px;
    }
    body {
      font-family: 'Prompt', ui-sans-serif, system-ui;
      font-size: 1.05rem;
      line-height: 1.7;
    }

    /* ฟอร์ม / ปุ่ม */
    input, select, textarea, button {
      font-size: 1rem;
    }
    label {
      font-size: 1rem;
    }

    /* radio / checkbox ให้กดง่ายขึ้น */
    input[type="radio"],
    input[type="checkbox"] {
      width: 1.25rem;
      height: 1.25rem;
    }

    .text-xs { font-size: 0.9rem; }
    .text-sm { font-size: 0.95rem; }

    input[type="radio"] {
      width: 22px;
      height: 22px;
      transform: scale(1.25);
      cursor: pointer;
    }

    label.mmse-option-big,
    label.flex-big {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    label.mmse-option-big:hover,
    label.flex-big:hover {
      background: #eef2ff;
    }

    .mmse-option-group {
      display: flex;
      gap: 20px;
      margin-top: 8px;
    }

    /* Global Interactive Hover Effects */
    .transition-all, .shadow-md, .shadow-sm, .shadow, .rounded-xl, .rounded-2xl, .rounded-3xl {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .bg-white.shadow-md:hover, .bg-white.shadow-sm:hover, .bg-white.shadow:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 40px rgba(0,0,0,0.1), 0 8px 16px rgba(0,0,0,0.06);
        z-index: 5;
    }

    button:not(:disabled), a.rounded-2xl, a.rounded-xl, input, select {
        transition: all 0.2s ease-out;
    }
    button:hover:not(:disabled), a.rounded-2xl:hover, a.rounded-xl:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }
    input:focus, select:focus, textarea:focus {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
    }
  </style>

  <!-- flatpickr CSS + JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/th.js"></script>
</head>

<body class="min-h-screen bg-[radial-gradient(1200px_600px_at_70%_10%,#eaf3ff,transparent),radial-gradient(800px_400px_at_30%_90%,#eefaff,transparent)]">

  
  {% block content %}{% endblock %}

  <!-- 🔵 Floating AI Chat Bubble -->
  <div id="ai-chat-bubble" class="fixed bottom-6 right-6 z-40">
    <!-- ปุ่มกลม ๆ -->
    <button id="ai-chat-toggle"
            class="w-14 h-14 rounded-full bg-blue-600 text-white shadow-xl
                   flex items-center justify-center text-2xl
                   hover:bg-blue-700 focus:outline-none">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
    </button>

    <!-- กล่องแชท -->
    <div id="ai-chat-panel"
         class="hidden mt-3 w-80 md:w-96 h-96 rounded-2xl shadow-2xl bg-white border border-slate-200 flex flex-col overflow-hidden">
      <!-- หัว -->
      <div class="px-4 py-2 bg-blue-600 text-white flex items-center justify-between">
        <div>
          <div class="text-sm font-semibold">AI ผู้ช่วยประเมิน</div>
          <div id="ai-chat-subtitle" class="text-xs opacity-80">
            ไว้ใช้ปรึกษา / ถามคำแนะนำระหว่างการประเมิน
          </div>
        </div>
        <button id="ai-chat-close" class="text-xl leading-none">&times;</button>
      </div>

      <!-- เนื้อแชท -->
      <div id="ai-chat-messages"
           class="flex-1 px-3 py-2 overflow-y-auto bg-slate-50 text-sm space-y-2">
        <div class="flex">
          <div class="max-w-[80%] rounded-2xl rounded-bl-none bg-white border border-slate-200 px-3 py-2">
            สวัสดีค่ะ สามารถถามเรื่องการประเมินหรือการตีความคะแนนได้เลย
          </div>
        </div>
      </div>

      <!-- ช่องพิมพ์ -->
      <form id="ai-chat-form" class="border-t border-slate-200 flex items-center gap-2 px-2 py-2">
        <input id="ai-chat-input"
               type="text"
               placeholder="พิมพ์คำถามถึง AI..."
               class="flex-1 border border-slate-300 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-500">
        <button type="submit"
                class="px-3 py-2 rounded-xl bg-blue-600 text-white text-sm font-medium hover:bg-blue-700">
          ส่ง
        </button>
      </form>
    </div>
  </div>

  <!-- JS สำหรับ Chat Bubble -->
  <script>
    const bubbleToggle = document.getElementById('ai-chat-toggle');
    const bubblePanel  = document.getElementById('ai-chat-panel');
    const bubbleClose  = document.getElementById('ai-chat-close');
    const chatForm     = document.getElementById('ai-chat-form');
    const chatInput    = document.getElementById('ai-chat-input');
    const chatMessages = document.getElementById('ai-chat-messages');
    const chatSubtitle = document.getElementById('ai-chat-subtitle');

    function getAiContext() {
      const el = document.getElementById('ai-context');
      if (!el) return {};
      return {
        hn: el.dataset.hn || null,
        gcn: el.dataset.gcn || null,
        name: el.dataset.name || null,
        page: el.dataset.page || document.title || null,
      };
    }

    function updateSubtitleFromContext() {
      const ctx = getAiContext();
      if (ctx.name) {
        chatSubtitle.textContent = `กำลังดูข้อมูล: ${ctx.name} (${ctx.hn || '-'} / ${ctx.gcn || '-'})`;
      } else {
        chatSubtitle.textContent = 'ไว้ใช้ปรึกษา / ถามคำแนะนำระหว่างการประเมิน';
      }
    }

    function openChat() {
      bubblePanel.classList.remove('hidden');
      updateSubtitleFromContext();
      chatInput.focus();
    }
    function closeChat() {
      bubblePanel.classList.add('hidden');
    }

    bubbleToggle.addEventListener('click', () => {
      if (bubblePanel.classList.contains('hidden')) {
        openChat();
      } else {
        closeChat();
      }
    });

    bubbleClose.addEventListener('click', closeChat);

    function appendMessage(text, from = 'user') {
      const wrapper = document.createElement('div');
      wrapper.className = from === 'user' ? 'flex justify-end' : 'flex';

      const bubble = document.createElement('div');
      bubble.className =
        from === 'user'
          ? 'max-w-[80%] rounded-2xl rounded-br-none bg-blue-600 text-white px-3 py-2 text-sm whitespace-pre-line'
          : 'max-w-[80%] rounded-2xl rounded-bl-none bg-white border border-slate-200 px-3 py-2 text-sm whitespace-pre-line';
      bubble.textContent = text;

      wrapper.appendChild(bubble);
      chatMessages.appendChild(wrapper);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    chatForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      chatInput.value = '';

      const ctx = getAiContext();

      try {
        const res = await fetch('/ai-chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, context: ctx })
        });
        const data = await res.json();
        appendMessage(data.reply || 'ไม่สามารถตอบกลับได้ในตอนนี้', 'ai');
      } catch (err) {
        appendMessage('มีข้อขัดข้องในการเชื่อมต่อเซิร์ฟเวอร์', 'ai');
      }
    });
  </script>

  <!-- flatpickr: อินพุตที่มี data-buddhist-date="1" จะเป็น พ.ศ. -->
  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const inputs = document.querySelectorAll('[data-buddhist-date="1"]');
    if (!inputs.length) return;

    inputs.forEach((input) => {
      flatpickr(input, {
        dateFormat: "d/m/Y",
        locale: "th",

        // พ.ศ. -> ค.ศ. เวลาแปลงเป็น Date
        parseDate: (datestr) => {
          if (!datestr) return null;
          const [day, month, buddhistYear] = datestr.split("/");
          const year = parseInt(buddhistYear, 10) - 543;
          return new Date(year, parseInt(month, 10) - 1, parseInt(day, 10));
        },

        // ค.ศ. -> พ.ศ. เวลาแสดงในช่อง input
        formatDate: (date) => {
          const d = ("0" + date.getDate()).slice(-2);
          const m = ("0" + (date.getMonth() + 1)).slice(-2);
          const y = date.getFullYear() + 543;
          return `${d}/${m}/${y}`;
        },
      });
    });
  });
  </script>
</body>
</html>
