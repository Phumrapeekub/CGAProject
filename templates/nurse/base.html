<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CGA Nurse{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/th.js"></script>
  <style> body { font-family: 'Sarabun', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-slate-900">
  <nav class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-[100] shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex justify-between items-center">
      <a href="{{ url_for('nurse.dashboard') }}" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
        <img src="{{ url_for('static', filename='logo.png') }}" alt="CGA Logo" class="w-8 h-8 object-contain">
        <span class="text-xl font-bold tracking-tight">CGA<span class="text-blue-600">Nurse</span></span>
      </a>
      <div class="hidden md:flex items-center gap-6 ml-8 mr-auto">
        <a href="{{ url_for('nurse.dashboard') }}" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition-colors">แดชบอร์ด</a>
        <a href="{{ url_for('nurse.patients') }}" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition-colors">รายชื่อผู้ป่วย</a>
        <a href="{{ url_for('nurse.assess_new') }}" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition-colors">ประเมินใหม่</a>
        <a href="{{ url_for('nurse.reports') }}" class="text-sm font-medium text-slate-600 hover:text-blue-600 transition-colors">รายงาน</a>
      </div>
      <div class="flex items-center gap-4">
        <span class="hidden sm:inline text-sm text-slate-600">ผู้ใช้งาน: <span class="font-semibold">{{ user }}</span></span>
        <a href="{{ url_for('auth.logout') }}" class="text-sm font-medium text-rose-600 hover:text-rose-700 transition-colors">ออกจากระบบ</a>
      </div>
    </div>
  </nav>
  <main class="py-6">
    <div class="max-w-7xl mx-auto px-4">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="mb-6 space-y-2">
            {% for category, message in messages %}
              <div class="p-4 rounded-xl border {% if category == 'danger' or category == 'error' %}bg-red-50 border-red-200 text-red-700{% elif category == 'success' %}bg-emerald-50 border-emerald-200 text-emerald-700{% else %}bg-amber-50 border-amber-200 text-amber-700{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
    </div>
    {% block content %}{% endblock %}
  </main>
  <!-- flatpickr: อินพุตที่มี data-buddhist-date="1" จะเป็น พ.ศ. -->
  <script>
  document.addEventListener("DOMContentLoaded", function () {
    const inputs = document.querySelectorAll('[data-buddhist-date="1"]');
    if (!inputs.length) return;

    inputs.forEach((input) => {
      flatpickr(input, {
        dateFormat: "d/m/Y",
        locale: "th",
        // บังคับให้แสดงปี พ.ศ. ใน Popup
        onOpen: function(selectedDates, dateStr, instance) {
            updateFlatpickrYear(instance);
        },
        onMonthChange: function(selectedDates, dateStr, instance) {
            setTimeout(() => updateFlatpickrYear(instance), 0);
        },
        onYearChange: function(selectedDates, dateStr, instance) {
            setTimeout(() => updateFlatpickrYear(instance), 0);
        },
        // พ.ศ. -> ค.ศ. (ตอนอ่านค่าจากช่องกรอก)
        parseDate: (datestr) => {
          if (!datestr) return null;
          const parts = datestr.split("/");
          if (parts.length !== 3) return null;
          let year = parseInt(parts[2], 10);
          // ถ้าปีเกิน 2400 แสดงว่าเป็น พ.ศ. ให้แปลงเป็น ค.ศ. ก่อนส่งเข้าเครื่อง
          if (year > 2400) year -= 543;
          return new Date(year, parseInt(parts[1], 10) - 1, parseInt(parts[0], 10));
        },
        // ค.ศ. -> พ.ศ. (ตอนแสดงผลกลับเข้าช่องกรอก)
        formatDate: (date) => {
          const d = ("0" + date.getDate()).slice(-2);
          const m = ("0" + (date.getMonth() + 1)).slice(-2);
          let y = date.getFullYear();
          // ถ้าปีเป็น ค.ศ. (น้อยกว่า 2400) ค่อยบวก 543
          if (y < 2400) y += 543;
          return `${d}/${m}/${y}`;
        },
      });
    });

    // ฟังก์ชันช่วยเปลี่ยนปีใน UI ของ Flatpickr เป็น พ.ศ.
    function updateFlatpickrYear(instance) {
        const yearInput = instance.currentYearElement;
        if (yearInput) {
            let year = parseInt(yearInput.value);
            if (year < 2400) {
                yearInput.value = year + 543;
            }
        }
    }
  });
  </script>

  <!-- [NEW] ระบบป้องกันข้อมูลสูญหาย (Enterprise Grade) -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
        // ใช้กับเฉพาะหน้าที่มีฟอร์มประเมินหลัก
        const form = document.getElementById("mainForm");
        if (!form) return;

        const draftKey = 'cga_draft_' + window.location.pathname;
        let isFormDirty = false;
        let isSubmitting = false;

        // 1. ระบบจำฝังใจ (Auto-save to LocalStorage)
        function loadDraft() {
            try {
                const draft = localStorage.getItem(draftKey);
                if (draft) {
                    const data = JSON.parse(draft);
                    let hasRestored = false;
                    
                    Array.from(form.elements).forEach(el => {
                        if (!el.name) return;
                        if (data[el.name] !== undefined) {
                            if (el.type === 'radio' || el.type === 'checkbox') {
                                // สำหรับตัวเลือก เช็คค่าให้ตรง
                                const isMatch = Array.isArray(data[el.name]) 
                                    ? data[el.name].includes(el.value) 
                                    : el.value === data[el.name];
                                if (isMatch && !el.checked) {
                                    el.checked = true;
                                    hasRestored = true;
                                    el.dispatchEvent(new Event('change', { bubbles: true }));
                                }
                            } else {
                                // สำหรับช่องข้อความ อย่าเขียนทับถ้ามีข้อมูลจากฐานข้อมูลมาอยู่แล้ว (ยกเว้นช่องว่าง)
                                if (!el.value || el.value === '' || el.value === 'none') {
                                    el.value = data[el.name];
                                    hasRestored = true;
                                    el.dispatchEvent(new Event('input', { bubbles: true }));
                                    el.dispatchEvent(new Event('change', { bubbles: true }));
                                }
                            }
                        }
                    });
                    
                    if (hasRestored) {
                        console.log("CGA System: กู้คืนข้อมูลร่าง (Draft) สำเร็จ");
                    }
                }
            } catch(e) { console.error("Draft load error", e); }
        }

        function saveDraft() {
            try {
                const data = {};
                const formData = new FormData(form);
                for (let [key, value] of formData.entries()) {
                    if (data[key] !== undefined) {
                        if (!Array.isArray(data[key])) data[key] = [data[key]];
                        data[key].push(value);
                    } else {
                        data[key] = value;
                    }
                }
                localStorage.setItem(draftKey, JSON.stringify(data));
                isFormDirty = true;
            } catch(e) {}
        }

        // จับเหตุการณ์การพิมพ์หรือคลิกเพื่อบันทึกร่างแบบเรียลไทม์
        form.addEventListener('input', saveDraft);
        form.addEventListener('change', saveDraft);

        // หน่วงเวลาโหลดร่างเพื่อให้ Script อื่นๆ (เช่น UI Toggles) ทำงานตั้งต้นให้เสร็จก่อน
        setTimeout(loadDraft, 300);

        // 2. ระบบแจ้งเตือนก่อนออก (Active Warning)
        window.cgaIsSubmitting = false;
        window.addEventListener('beforeunload', function (e) {
            if (isFormDirty && !window.cgaIsSubmitting) {
                e.preventDefault();
                e.returnValue = ''; // มาตรฐานสำหรับให้เบราว์เซอร์โชว์ Popup
            }
        });

        // 3. ปิดระบบแจ้งเตือนและล้างร่างเมื่อบันทึกจริง
        form.addEventListener('submit', function() {
            window.cgaIsSubmitting = true;
            localStorage.removeItem(draftKey);
        });
        
        // Helper function for manual JS submits
        window.cgaSubmitForm = function() {
            window.cgaIsSubmitting = true;
            localStorage.removeItem(draftKey);
            form.submit();
        };
    });
  </script>
</body>
</html>
